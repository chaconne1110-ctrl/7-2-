<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전력공학</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f8;
}

header {
    text-align: center;
    background: #1e3a5f;
    color: white;
    padding: 30px;
}

.card-container {
    display: flex;
    gap: 20px;
    padding: 30px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    width: 220px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card h3 {
    padding: 10px;
    margin: 0;
    text-align: center;
}

section { display: none; }
section.active { display: block; }

</style>
</head>

<body>

<!-- ✅ 오디오 하나만 유지 -->
<audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" style="
position:fixed;
bottom:20px;
right:20px;
padding:10px 15px;
background:#2c5282;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
z-index:999;">
🎵 음악 켜기
</button>

<header>
    <h1>전력공학</h1>
    <button onclick="logout()" style="
position:absolute;
right:20px;
top:20px;
padding:8px 15px;
background:#e53e3e;
color:white;
border:none;
border-radius:6px;
cursor:pointer;">
로그아웃</button>
</header>

<div class="card-container">
    <div class="card" onclick="showSection('generation')">
        <h3>발전</h3>
    </div>
    <div class="card" onclick="showSection('transmission')">
        <h3>송전</h3>
    </div>
</div>

<section id="generation" class="active">
    <h3>발전</h3>
</section>

<section id="transmission">
    <h3>송전</h3>
</section>

<script>
// 페이지 이동
function showSection(id){
    document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

// ✅ 로그아웃 수정 (핵심)
function logout(){
    window.location.href = "index.html";
}

// 오디오
const audio = document.getElementById("bgm");
const btn = document.getElementById("musicBtn");

audio.volume = 0.3;

btn.addEventListener("click", function(){
    if(audio.paused){
        audio.play();
        btn.innerText = "⏸ 음악 끄기";
    } else {
        audio.pause();
        btn.innerText = "🎵 음악 켜기";
    }
});
</script>

</body>
</html>
