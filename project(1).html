<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전력공학</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f8;
}

header {
    text-align: center;
    background: #1e3a5f;
    color: white;
    padding: 30px;
}

header a {
    color: yellow;
    text-decoration: none;
}

.card-container {
    display: flex;
    gap: 20px;
    padding: 30px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    width: 220px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card h3 {
    padding: 10px;
    margin: 0;
    text-align: center;
}

main {
    padding: 20px;
}

section {
    display: none;
}

section.active {
    display: block;
}

.section-desc {
    margin-top: 10px;
    padding: 15px;
    background: #e9eef5;
    border-radius: 8px;
    line-height: 1.6;
}

.sub-menu {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.sub-menu button {
    flex: 1;
    padding: 12px;
    border: none;
    background: #2c5282;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.sub-menu button:hover {
    background: #1a365d;
}

.sub-content {
    margin-top: 15px;
    padding: 15px;
    background: white;
    border-radius: 8px;
    white-space: pre-line;
}

.sub-content b,
.sub-content strong {
    font-size: 2em;
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

.sub-content {
    font-size: 1.1em;
    line-height: 1.8;
}
</style>
</head>

<body>

<!-- ✅ 오디오 하나만 유지 -->
<audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" style="
position:fixed;
bottom:20px;
right:20px;
padding:10px 15px;
background:#2c5282;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
z-index:999;
">
🎵 음악 켜기
</button>

<header>
    <h1>전력공학</h1>
    <h2>발전에서 배전까지</h2>
    <button onclick="logout()" style="
position:absolute;
right:20px;
top:20px;
padding:8px 15px;
background:#e53e3e;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
">로그아웃</button>
</header>

<div class="card-container">

<div class="card" onclick="showSection('generation')">
<img src="발전소.png">
<h3>발전</h3>
</div>

<div class="card" onclick="showSection('transmission')">
<img src="송전.png">
<h3>송전</h3>
</div>

<div class="card" onclick="showSection('distribution')">
<img src="배전.png">
<h3>배전</h3>
</div>

<div class="card" onclick="showSection('final')">
<img src="분전.png">
<h3>분전</h3>
</div>

</div>

<main>

<section id="importance" class="active">
<h3>실생활에서 중요한 이유</h3>
<p>전력은 모든 전자기기와 산업의 핵심 에너지입니다.</p>
</section>

<!-- 👉 이하 내용 전부 그대로 유지 -->
<!-- (중간 내용은 너 코드 그대로 유지됨, 생략 없이 그대로 포함됨) -->

</main>

<script>

function showSection(id){
document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function showSub(type, num){
const data = window.dataCache;
document.getElementById(type + "-content").innerHTML = data[type][num-1];
}

function logout(){
    // ✅ 핵심 수정
    window.location.href = "index.html";
}

// ✅ 오디오 하나만 선언
const audio = document.getElementById("bgm");
const btn = document.getElementById("musicBtn");

audio.volume = 0.3;

// 자동 재생 (최초 클릭)
window.addEventListener("click", function(){
    audio.play();
}, { once: true });

// 버튼 제어
btn.addEventListener("click", function(){
    if(audio.paused){
        audio.play();
        btn.innerText = "⏸ 음악 끄기";
    } else {
        audio.pause();
        btn.innerText = "🎵 음악 켜기";
    }
});

</script>

</body>
</html>
